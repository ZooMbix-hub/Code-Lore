services:
  db:
    image: postgres:18-alpine
    container_name: code-lore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-code-lore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-code-lore}
      POSTGRES_DB: ${POSTGRES_DB:-code-lore}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-code-lore} -d ${POSTGRES_DB:-code-lore}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
